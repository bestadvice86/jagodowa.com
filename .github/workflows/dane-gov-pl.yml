name: dane.gov.pl - codzienna aktualizacja cen (art. 19b)

on:
  schedule:
    - cron: "7 23 * * *"      # codziennie 23:07 UTC = 00:07 (zima) / 01:07 (lato) czasu polskiego
  push:
    branches: [main]
    paths: ["dane.js", "gen-dane-gov.js"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generuj CSV i XML z dane.js
        run: node gen-dane-gov.js
      - name: Commit, jesli cos sie zmienilo
        run: |
          git config user.name "jagodowa-bot"
          git config user.email "biuro@jagodowa.com"
          git add ceny-ofertowe-jagodowa-invest.csv dane-gov-pl.xml dane-gov-pl.md5 dane-gov-pl.xml.md5 csv
          git diff --cached --quiet || git commit -m "dane.gov.pl: aktualizacja $(date -u +%Y-%m-%d)"
          git push
